<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | My Store</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .login-section {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            background: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .login-header {
            background: #212529;
            color: white;
            text-align: center;
            padding: 30px 25px;
        }

        .login-header h2 {
            margin: 0;
            font-weight: 600;
        }

        .login-header p {
            margin: 8px 0 0;
            color: #adb5bd;
            font-size: 14px;
        }

        .login-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 9px;
            border: 1px solid #dee2e6;
            transition: 0.2s ease;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        }

        .login-btn {
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .register-link {
            text-decoration: none;
            font-weight: 500;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .brand-icon {
            width: 55px;
            height: 55px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <!-- Navbar Fragment -->
    <div th:replace="fragments/navbar :: navbar"></div>


    <!-- Login Section -->
    <section class="login-section">

        <div class="card login-card">

            <!-- Header -->
            <div class="login-header">

                <div class="brand-icon">
                    🔐
                </div>

                <h2>Welcome Back</h2>

                <p>
                    Login to continue to your account
                </p>

            </div>


            <!-- Login Form -->
            <div class="login-body">

                <form th:action="@{/login}"
                      method="post">


                    <!-- Username -->
                    <div class="mb-4">

                        <label for="username"
                               class="form-label">
                            Username
                        </label>

                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               placeholder="Enter your username"
                               autocomplete="username"
                               required>

                    </div>


                    <!-- Password -->
                    <div class="mb-4">

                        <label for="password"
                               class="form-label">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>

                    </div>


                    <!-- Login Button -->
                    <div class="d-grid">

                        <button type="submit"
                                class="btn btn-primary login-btn">
                            Login
                        </button>

                    </div>

                </form>


                <!-- Register -->
                <div class="text-center mt-4">

                    <span class="text-muted">
                        Don't have an account?
                    </span>

                    <a th:href="@{/register}"
                       class="register-link ms-1">
                        Register here
                    </a>

                </div>

            </div>

        </div>

    </section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
