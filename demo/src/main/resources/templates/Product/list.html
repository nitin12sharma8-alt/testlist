<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product List</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .page-container {
            max-width: 1200px;
            margin: 50px auto;
        }

        .main-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .card-header-custom {
            background: #212529;
            color: white;
            padding: 20px 25px;
        }

        .card-header-custom h2 {
            margin: 0;
            font-weight: 600;
        }

        .table {
            margin-bottom: 0;
            vertical-align: middle;
        }

        .table thead th {
            background: #f1f3f5;
            color: #495057;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .table tbody tr {
            transition: 0.2s ease;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }

        .product-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .no-image {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 12px;
        }

        .product-name {
            font-weight: 600;
            color: #212529;
        }

        .price {
            font-weight: 600;
            color: #198754;
        }

        .quantity {
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            border-radius: 8px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

    </style>
</head>

<body>

    <!-- Navbar Fragment -->
    <div th:replace="fragments/navbar :: navbar"></div>

<div class="container page-container">

    <!-- Main Card -->
    <div class="card main-card">

        <!-- Header -->
        <div class="card-header-custom d-flex justify-content-between align-items-center">

            <div>
                <h2>Product List</h2>
                <small class="text-white-50">
                    Manage your products
                </small>
            </div>

            <a href="/products/create"
               class="btn btn-primary">
                + Add Product
            </a>

        </div>


        <!-- Table -->
        <div class="table-responsive">

            <table class="table table-hover">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <!-- Products -->
                    <tr th:each="product : ${Products}">

                        <!-- ID -->
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${product.id}">
                            </span>
                        </td>


                        <!-- Image -->
                        <td>

                            <img th:if="${product.image != null}"
                                 th:src="@{/products/image/{id}(id=${product.id})}"
                                 class="product-img"
                                 alt="Product Image">

                            <div th:if="${product.image == null}"
                                 class="no-image">
                                No Image
                            </div>

                        </td>


                        <!-- Name -->
                        <td>
                            <span class="product-name"
                                  th:text="${product.name}">
                            </span>
                        </td>


                        <!-- Description -->
                        <td th:text="${product.description}">
                        </td>


                        <!-- Category -->
                        <td>

                            <span class="badge bg-light text-dark border"
                                  th:text="${product.category}">
                            </span>

                        </td>


                        <!-- Price -->
                        <td>

                            <span class="price">
                                ₹
                                <span th:text="${product.price}">
                                </span>
                            </span>

                        </td>


                        <!-- Quantity -->
                        <td>

                            <span class="quantity"
                                  th:text="${product.qty}">
                            </span>

                        </td>


                        <!-- Actions -->
                        <td>

                            <div class="action-buttons">

                                <a th:href="@{/products/edit/{id}(id=${product.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Edit
                                </a>

                                <a th:href="@{/products/delete/{id}(id=${product.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Are you sure you want to delete this product?');">
                                    Delete
                                </a>

                            </div>

                        </td>

                    </tr>


                    <!-- Empty Products -->
                    <tr th:if="${#lists.isEmpty(Products)}">

                        <td colspan="8"
                            class="empty-message">

                            <h5>No Products Found</h5>

                            <p class="mb-0">
                                Start by adding your first product.
                            </p>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
