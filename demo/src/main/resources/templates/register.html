<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | My Store</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .register-section {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        /* Header */
        .register-header {
            background: #212529;
            color: white;
            text-align: center;
            padding: 30px 25px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0d6efd;
            border-radius: 50%;

            font-size: 25px;
        }

        .register-header h2 {
            margin: 0;
            font-weight: 600;
        }

        .register-header p {
            margin: 8px 0 0;
            color: #adb5bd;
            font-size: 14px;
        }

        /* Form Area */
        .register-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
            margin-bottom: 7px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 9px;
            border: 1px solid #dee2e6;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        }

        /* Register Button */
        .register-btn {
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .register-btn:hover {
            transform: translateY(-1px);
        }

        /* Error */
        .alert {
            border-radius: 9px;
            font-size: 14px;
        }

        /* Login Link */
        .login-text {
            color: #6c757d;
            font-size: 14px;
        }

        .login-link {
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .required-star {
            color: #dc3545;
        }

        /* Mobile */
        @media (max-width: 576px) {

            .register-section {
                padding: 25px 12px;
            }

            .register-body {
                padding: 25px 20px;
            }

            .register-header {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>


    <!-- Register Section -->
    <section class="register-section">

        <div class="card register-card">

            <!-- Header -->
            <div class="register-header">

                <div class="brand-icon">
                    👤
                </div>

                <h2>Create Account</h2>

                <p>Register to get started with your account</p>

            </div>


            <!-- Form Body -->
            <div class="register-body">

                <!-- Error Message -->
                <div
                    class="alert alert-danger mb-4"
                    th:if="${errorMessage}"
                    th:text="${errorMessage}">
                </div>


                <!-- Register Form -->
                <form
                    th:action="@{/register}"
                    method="post">


                    <!-- Username -->
                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label">

                            Username
                            <span class="required-star">*</span>

                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label">

                            Email Address
                            <span class="required-star">*</span>

                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label">

                            Password
                            <span class="required-star">*</span>

                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required>

                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-4">

                        <label
                            for="confirmPassword"
                            class="form-label">

                            Confirm Password
                            <span class="required-star">*</span>

                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="form-control"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required>

                    </div>


                    <!-- Register Button -->
                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary register-btn">

                            Create Account

                        </button>

                    </div>

                </form>


                <!-- Login -->
                <div class="text-center mt-4">

                    <span class="login-text">
                        Already have an account?
                    </span>

                    <a
                        th:href="@{/login}"
                        class="login-link ms-1">

                        Login here

                    </a>

                </div>

            </div>

        </div>

    </section>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
